<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eintrag bearbeiten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>Eintrag bearbeiten</h1>

      <form action="{{ url_for('edit_idea', id=idea['id']) }}" method="post" class="edit-form">
        <label for="title">Titel</label>
        <input id="title" name="title" type="text" value="{{ idea['title'] }}" required>

        <label for="category">Kategorie</label>
        <input id="category" name="category" type="text" value="{{ idea['category'] }}">

        <label for="status">Status</label>
        <select id="status" name="status">
          {% for status in statuses %}
            <option value="{{ status }}" {% if idea['status'] == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>

        <div class="form-actions">
          <a href="{{ url_for('index') }}" class="link-button">Zurück</a>
          <button type="submit">Änderungen speichern</button>
        </div>
      </form>
    </div>
  </body>
</html>
